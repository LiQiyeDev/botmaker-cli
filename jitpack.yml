jdk:
  - openjdk21
install:
  # The committed pom pins botmaker.studioapi.version and botmaker.pluginhost.version to 0.0.0-SNAPSHOT
  # (the reactor/dev value). JitPack cannot resolve a SNAPSHOT, so the tags are injected via -D at build
  # time and the committed pom is never edited. They come from .deps.env, written by the umbrella
  # release.sh in this release's own commit, so they are the refs this tag was actually cut against rather
  # than whatever `git ls-remote --tags | tail -1` happens to return.
  #
  # REQUIRED rather than defaulted: pom.xml runs flatten-maven-plugin, so whatever is injected here is
  # BAKED INTO the published pom — and the published pom is what the plugin registry's CI resolves to run
  # `validate` as a library. A stale default would point it at a long-dead loader, and a loader that
  # disagrees with Studio's is a gate that admits plugins Studio then refuses.
  - . ./.deps.env
  - '[ -n "${STUDIO_API_TAG:-}" ] || { echo "ERROR: .deps.env must pin STUDIO_API_TAG. Cut releases with the umbrella release.sh, which writes it into the release commit." >&2; exit 1; }'
  - '[ -n "${PLUGIN_HOST_TAG:-}" ] || { echo "ERROR: .deps.env must pin PLUGIN_HOST_TAG. Cut releases with the umbrella release.sh, which writes it into the release commit." >&2; exit 1; }'
  - mvn install -DskipTests -Dmaven.javadoc.skip=true -B -Dbotmaker.studioapi.version=$STUDIO_API_TAG -Dbotmaker.pluginhost.version=$PLUGIN_HOST_TAG
